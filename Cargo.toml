[workspace]
resolver = "2"
members = ["apps/ide", "crates/domain", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["RIju Mondal <rijum8906@gmail.com>"]
license = "MIT"
rust-version = "1.85.0"

[workspace.dependencies]
# Internal Crates
domain = { path = "crates/domain" }
tui = { path = "crates/tui" }

# Async & Concurrency
tokio = { version = "1.52.3", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "signal",
] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Error
thiserror = "2.0.18"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"

# Terminal
ratatui = "0.30.2"
color-eyre = "0.6.5"
crossterm = "0.29.0"
